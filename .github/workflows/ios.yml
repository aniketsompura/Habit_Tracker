name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          set +e
          swift test --package-path ios > test.log 2>&1
          status=$?
          grep -E "error:|failed|passed after|Executed|warning: unre" test.log | grep -v "^\[" | head -150
          tail -3 test.log
          exit $status

  build:
    name: Build app and widgets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild \
            -project ios/Sadhana.xcodeproj \
            -scheme Sadhana \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          grep -E "^/.*(error|warning): " build.log | sed 's|/Users/runner/work/Habit_Tracker/Habit_Tracker/||' | sort -u | head -200
          grep -E "\*\* BUILD" build.log
          exit $status
